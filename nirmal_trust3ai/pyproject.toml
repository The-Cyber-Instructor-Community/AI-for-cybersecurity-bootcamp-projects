[project]
name = "sentinel"
version = "0.1.0"
description = "Multi-agent security reviewer for LLM and agent applications (AI Security Bootcamp capstone)"
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "semgrep>=1.100",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

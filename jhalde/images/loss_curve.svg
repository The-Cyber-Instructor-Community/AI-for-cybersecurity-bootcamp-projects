<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" width="460" height="160">
  <rect width="460" height="160" fill="#111827" rx="10"/>

  <text x="230" y="24" text-anchor="middle" fill="#d1d5db" font-size="13" font-family="sans-serif" font-weight="bold">Fine-Tuning Loss Curve — Llama 3.1 8B QLoRA</text>
  <text x="230" y="40" text-anchor="middle" fill="#9ca3af" font-size="9" font-family="sans-serif">500 CVE analysis training pairs · 3 epochs · Google Colab T4</text>

  <!-- Axes -->
  <rect x="60" y="52" width="340" height="1" fill="#374151"/>
  <rect x="60" y="52" width="1" height="78" fill="#374151"/>

  <!-- Y-axis labels -->
  <text x="55" y="56"  text-anchor="end" fill="#9ca3af" font-size="8" font-family="sans-serif">2.0</text>
  <text x="55" y="91"  text-anchor="end" fill="#9ca3af" font-size="8" font-family="sans-serif">1.0</text>
  <text x="55" y="130" text-anchor="end" fill="#9ca3af" font-size="8" font-family="sans-serif">0.0</text>

  <!-- Grid lines -->
  <line x1="60" y1="91"  x2="400" y2="91"  stroke="#374151" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Bars -->
  <rect x="100" y="56"  width="70" height="74" rx="5" fill="#8b7ec825" stroke="#8b7ec8" stroke-width="1.2"/>
  <rect x="215" y="74"  width="70" height="56" rx="5" fill="#8b7ec850" stroke="#8b7ec8" stroke-width="1.2"/>
  <rect x="330" y="93"  width="70" height="37" rx="5" fill="#8b7ec8"   stroke="#8b7ec8" stroke-width="1.2"/>

  <!-- Value labels on top of bars -->
  <text x="135" y="50"  text-anchor="middle" fill="#d1d5db" font-size="12" font-family="sans-serif" font-weight="bold">1.92</text>
  <text x="250" y="68"  text-anchor="middle" fill="#d1d5db" font-size="12" font-family="sans-serif" font-weight="bold">1.28</text>
  <text x="365" y="87"  text-anchor="middle" fill="#5a9e78" font-size="12" font-family="sans-serif" font-weight="bold">0.73</text>

  <!-- Epoch labels -->
  <text x="135" y="145" text-anchor="middle" fill="#9ca3af" font-size="10" font-family="sans-serif">Epoch 1</text>
  <text x="250" y="145" text-anchor="middle" fill="#9ca3af" font-size="10" font-family="sans-serif">Epoch 2</text>
  <text x="365" y="145" text-anchor="middle" fill="#5a9e78" font-size="10" font-family="sans-serif" font-weight="bold">Epoch 3</text>

  <!-- Trend arrow -->
  <line x1="135" y1="70" x2="365" y2="100" stroke="#5a9e78" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>

  <!-- Annotation -->
  <text x="395" y="97" fill="#5a9e78" font-size="9" font-family="sans-serif">−62%</text>
</svg>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera"
version = "0.1.0"
description = "Code-first identity screening for remote job candidates (bootcamp capstone)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pdfplumber>=0.11",
    "phonenumbers>=8.13",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = ["faker>=24.0", "reportlab>=4.0", "pytest>=8.0", "opencv-python>=4.9"]
# The Console (python -m chimera.api); the same as requirements-ui.txt. reportlab writes the PDF report (Oct 25).
console = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "httpx>=0.27", "reportlab>=4.0"]

[project.scripts]
chimera = "chimera.cli:main"

[tool.setuptools]
packages = ["chimera"]

[tool.pytest.ini_options]
testpaths = ["tests"]

display_information:
  name: SOC Co-pilot
  description: Approve/reject/edit response actions proposed by the AI SOC pipeline
  background_color: "#1a1a2e"

features:
  bot_user:
    display_name: soc-copilot
    always_online: true

oauth_config:
  scopes:
    bot:
      - chat:write

settings:
  socket_mode_enabled: true
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false

<text x="1128" y="758" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">python -m triage_lab serve · localhost:8765</text>
<text x="1128" y="777" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">answers questions from the saved results</text>

<text x="1128" y="168" font-size="15.5" font-weight="700" fill="#1C2433" text-anchor="start">Pipeline</text>
<text x="1128" y="190" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">python -m triage_lab stage main --backend langflow</text>
<text x="1128" y="209" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">sends each incident with the triage instructions</text>
<text x="1128" y="228" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">to triage-rag / triage-norag / triage-poisoned</text>
<rect x="1110" y="320" width="430" height="74" rx="10" fill="#DCE8F6" stroke="#2F6FB0" stroke-width="2"/>
<text x="1128" y="348" font-size="15.5" font-weight="700" fill="#1C2433" text-anchor="start">Verifier</text>
<text x="1128" y="370" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">checks every claim against the raw events</text>
<rect x="1110" y="422" width="430" height="74" rx="10" fill="#DCE8F6" stroke="#2F6FB0" stroke-width="2"/>
<text x="1128" y="450" font-size="15.5" font-weight="700" fill="#1C2433" text-anchor="start">Gates v1 + v2</text>
<text x="1128" y="472" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">decide close or escalate; never read the reasoning</text>
<rect x="1110" y="524" width="430" height="74" rx="10" fill="#FFFFFF" stroke="#2F6FB0" stroke-width="1.2"/>
<text x="1128" y="552" font-size="15.5" font-weight="700" fill="#1C2433" text-anchor="start">Results</text>
<text x="1128" y="574" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">metrics, REPORT.md, one case file per incident</text>
<rect x="1110" y="708" width="430" height="96" rx="10" fill="#FFFFFF" stroke="#2F6FB0" stroke-width="1.2"/>
